<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unit Converter PWA</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f3f4f6;
      color: #1f2937;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      background-color: #ffffff;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 450px;
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #111827;
    }

    .converter-group {
      margin-bottom: 20px;
      padding: 12px;
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    .group-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #4b5563;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .field {
      flex: 1;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #6b7280;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="number"]:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .equals {
      font-size: 1.2rem;
      font-weight: bold;
      color: #9ca3af;
      margin-top: 18px;
    }

    .clear-btn {
      width: 100%;
      padding: 12px;
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .clear-btn:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Unit Converter</h1>

    <!-- Meters <-> Feet -->
    <div class="converter-group">
      <div class="group-title">Length (Meters / Feet)</div>
      <div class="row">
        <div class="field">
          <label for="meters">Meters</label>
          <input type="number" id="meters" placeholder="0" step="any">
        </div>
        <div class="equals">=</div>
        <div class="field">
          <label for="feet">Feet</label>
          <input type="number" id="feet" placeholder="0" step="any">
        </div>
      </div>
    </div>

    <!-- Centimeters <-> Inches -->
    <div class="converter-group">
      <div class="group-title">Length (CM / Inches)</div>
      <div class="row">
        <div class="field">
          <label for="cm">Centimeters</label>
          <input type="number" id="cm" placeholder="0" step="any">
        </div>
        <div class="equals">=</div>
        <div class="field">
          <label for="inches">Inches</label>
          <input type="number" id="inches" placeholder="0" step="any">
        </div>
      </div>
    </div>

    <!-- Kilometers <-> Miles -->
    <div class="converter-group">
      <div class="group-title">Distance (KM / Miles)</div>
      <div class="row">
        <div class="field">
          <label for="km">Kilometers</label>
          <input type="number" id="km" placeholder="0" step="any">
        </div>
        <div class="equals">=</div>
        <div class="field">
          <label for="miles">Miles</label>
          <input type="number" id="miles" placeholder="0" step="any">
        </div>
      </div>
    </div>

    <button class="clear-btn" id="clear-btn">Clear All</button>
  </div>

  <script>
    // Two-way Conversion Logic
    const metersInput = document.getElementById('meters');
    const feetInput = document.getElementById('feet');

    const cmInput = document.getElementById('cm');
    const inchesInput = document.getElementById('inches');

    const kmInput = document.getElementById('km');
    const milesInput = document.getElementById('miles');

    const clearBtn = document.getElementById('clear-btn');

    // Helper to format precision cleanly
    function formatValue(val) {
      if (val === '' || isNaN(val)) return '';
      return parseFloat(val.toFixed(4)).toString();
    }

    // Meters <-> Feet
    metersInput.addEventListener('input', () => {
      if (metersInput.value === '') { feetInput.value = ''; return; }
      feetInput.value = formatValue(parseFloat(metersInput.value) * 3.28084);
    });

    feetInput.addEventListener('input', () => {
      if (feetInput.value === '') { metersInput.value = ''; return; }
      metersInput.value = formatValue(parseFloat(feetInput.value) / 3.28084);
    });

    // CM <-> Inches
    cmInput.addEventListener('input', () => {
      if (cmInput.value === '') { inchesInput.value = ''; return; }
      inchesInput.value = formatValue(parseFloat(cmInput.value) / 2.54);
    });

    inchesInput.addEventListener('input', () => {
      if (inchesInput.value === '') { cmInput.value = ''; return; }
      cmInput.value = formatValue(parseFloat(inchesInput.value) * 2.54);
    });

    // KM <-> Miles
    kmInput.addEventListener('input', () => {
      if (kmInput.value === '') { milesInput.value = ''; return; }
      milesInput.value = formatValue(parseFloat(kmInput.value) * 0.621371);
    });

    milesInput.addEventListener('input', () => {
      if (milesInput.value === '') { kmInput.value = ''; return; }
      kmInput.value = formatValue(parseFloat(milesInput.value) / 0.621371);
    });

    // Clear All
    clearBtn.addEventListener('click', () => {
      metersInput.value = '';
      feetInput.value = '';
      cmInput.value = '';
      inchesInput.value = '';
      kmInput.value = '';
      milesInput.value = '';
    });

    // Register Service Worker for PWA functionality
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker Registered'))
          .catch(err => console.log('Service Worker Registration Failed', err));
      });
    }
  </script>
</body>
</html>
